<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game</title>
    <style>
        .deck {
            margin: 10px;
            padding: 5px;
            border: 1px solid #000;
            display: inline-block;
        }
        #stock, #discard {
            font-weight: bold;
        }
        #suits, #piles {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Card Game</h1>
    <div class="deck" id="stock">Stock: </div>
    <div class="deck" id="discard">Discard: </div>
    <div id="suits">
        <h2>Suits</h2>
    </div>
    <div id="piles">
        <h2>Piles</h2>
    </div>
    <script src="scripts/klondike.js"></script>
</body>
</html>
