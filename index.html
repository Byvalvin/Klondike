<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klondike Solitaire</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .deck {
            border: 1px solid #000;
            width: 80px;
            height: 120px;
            margin: 5px;
            display: inline-block;
            vertical-align: top;
            position: relative;
        }
        .deck-label {
            background-color: #f1f1f1;
            padding: 2px;
            text-align: center;
            font-weight: bold;
        }
        .deck-content {
            position: absolute;
            top: 30px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            overflow: hidden;
            text-align: center;
        }
        .card {
            width: 70px;
            height: 100px;
            border: 1px solid #ccc;
            margin: 2px;
            line-height: 100px;
            text-align: center;
            background-color: #fff;
        }
        .card.face-down {
            background-color: #000;
            color: #000;
        }
    </style>
</head>
<body>
    <header>
        <h1>Klondike Solitaire</h1>
        <p id="status">Welcome to Klondike Solitaire!</p>
    </header>
    
    <main>
        <section id="controls">
            <button id="reset-button">Reset Game</button>
            <button id="discard-button">Discard Cards</button>
            <button id="board-button">Show Board</button>
            <button id="cheat-button">Cheat</button>
            <button id="save-button">Save Game</button>
            <button id="load-button">Load Game</button>
            <button id="done-button">End Game</button>
        </section>

        <section id="game-board" class="game-board">
            <!-- Game board will be dynamically updated by klondikeGame.js -->
        </section>
    </main>
    
    <script src="scripts/card.js"></script>
    <script src="scripts/deck.js"></script>
    <script src="scripts/klondikeGame.js"></script>
</body>
</html>
