<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klondike Solitaire</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div id="logo-container">
            <!-- Placeholder for dynamically added card logo -->
            <div id="card-logo" class="card-logo"></div>
            <h1>Klondike Solitaire</h1>
        </div>
        <p id="status">Welcome to Klondike Solitaire!</p>
    </header>
    <main>
        <section id="controls">
            <div id="difficulty-selector">
                <label for="difficulty">Select Difficulty:</label>
                <select id="difficulty">
                    <!-- Options will be populated by JavaScript -->
                </select>
                <button id="start-button">Start Game</button>
            </div>

            <!-- Timer Display and Toggle Button -->
            <div id="timer-container" class="hidden-timer">
                <div id="timer">00:00</div>
                <button id="toggle-timer" class="icon-button" title="Toggle Timer">
                    <span class="material-icons">timer</span>
                    <span>Hide Timer</span>
                </button>
            </div>     
            
            <div id="game-controls">
                <button id="reset-button">Restock</button>
                <button id="discard-button">Discard</button>
                <button id="cheat-button" class="hidden">Cheat</button>
            </div>
            <div id="state-controls">
                <button id="save-button" class="icon-button" title="Save Game">
                    <span class="material-icons">save</span>
                </button>
                
                <button id="load-button" class="icon-button" title="Load Game">
                    <span class="material-icons">folder_open</span>
                </button>
                
                <button id="done-button" class="icon-button" title="End Game">
                    <span class="material-icons">close</span>
                </button>
            </div>

        </section>

        <section id="game-board" class="game-board">
            <!-- Game board will be dynamically updated by game.js -->
        </section>
    </main>
    <script src="scripts/loadCode.js" defer=true></script>
    <script src="scripts/card.js" defer=true></script>
    <script src="scripts/deck.js" defer=true></script>
    <script src="scripts/difficulty.js" defer=true></script>
    <script src="scripts/game.js" defer=true></script>
    <script src="scripts/klondike.js" defer=true></script>
</body>
</html>
