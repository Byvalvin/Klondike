<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klondike Solitaire</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Klondike Solitaire</h1>
        <div id="controls">
            <button onclick="resetGame()">Reset</button>
            <button onclick="discardFromStock()">Discard</button>
            <button onclick="showBoard()">Show Board</button>
            <button onclick="cheat()">Cheat</button>
            <button onclick="saveGame()">Save Game</button>
            <button onclick="loadGame()">Load Game</button>
            <button onclick="endGame()">End Game</button>
        </div>
        <div id="game-board">
            <!-- The game board will be dynamically populated by JavaScript -->
        </div>
        <div id="status"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
