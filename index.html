<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klondike Solitaire</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div id="logo-container">
            <div id="card-logo" class="card-logo"></div>
            <h1>Klondike Solitaire</h1>
        </div>
        <p id="status">Welcome to Klondike Solitaire!</p>
    </header>
    <main>
        <section id="controls">
            <div id="difficulty-section">
                <!-- Difficulty Selector and Start Button -->
                <div id="difficulty-selector">
                    <label for="difficulty">Select Difficulty:</label>
                    <select id="difficulty">
                        <!-- Options will be populated by JavaScript -->
                    </select>
                    <button id="start-button">Start Game</button>
                </div>

                <!-- Difficulty Info Section -->
               <div id="difficulty-info" class="hidden">
                    <div id="difficulty-info-header-container">
                        <h2 id="difficulty-info-header">Difficulty Info</h2>
                    </div>
                    <div id="difficulty-info-details">
                        <p><strong>Pile Order:</strong> <span id="pile-ordering-info"></span></p>
                        <p><strong>Piles:</strong> <span id="number-of-piles-info"></span></p>
                        <p><strong>Suit Order:</strong> <span id="suit-ordering-info"></span></p>
                        <p><strong>Timed:</strong> <span id="timed-info"></span></p>
                    </div>
                </div>

            </div>

            <!--Score display -->
            <div id="score">Score: 0</div>
            
            <!-- Timer Display and Toggle Button -->
            <div id="timer-container">
                <div id="timer">00:00</div>
                <button id="toggle-timer" class="icon-button" title="Toggle Timer" aria-label="Toggle Timer">
                    <span class="material-icons">timer</span>
                </button>
            </div>

            <div id="game-controls">
                <button id="cheat-button" class="icon-button hidden" aria-label="Cheat">Cheat</button>
            </div>
            <div id="state-controls">
                <button id="save-button" class="icon-button" aria-label="Save Game" title="Save Game">
                    <span class="material-icons">save</span>
                </button>
                
                <button id="load-button" class="icon-button" aria-label="Load Game" title="Load Game">
                    <span class="material-icons">folder_open</span>
                </button>
                
                <button id="done-button" class="icon-button" aria-label="End Game" title="End Game">
                    <span class="material-icons">close</span>
                </button>
            </div>
        </section>

        <!-- Game History Table -->
        <section id="game-history" class="hidden">
            <h2>Game History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Difficulty</th>
                        <th>Parameters</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be populated by gameHistory.js -->
                </tbody>
            </table>
            <button id="toggle-game-history" class="icon-button" aria-label="Toggle Game History">
                <span class="material-icons">keyboard_arrow_down</span>
            </button>
        </section>

        <section id="game-board" class="game-board">
            <!-- Game board will be dynamically updated by game.js -->
        </section>
    </main>
    <script src="scripts/loadCode.js" defer></script>
    <script src="scripts/card.js" defer></script>
    <script src="scripts/deck.js" defer></script>
    <script src="scripts/difficulty.js" defer></script>
    <script src="scripts/game.js" defer></script>
    <script src="scripts/klondike.js" defer></script>
    <script src="scripts/gameHistory.js" defer></script>
</body>
</html>
