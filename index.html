<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .deck { margin: 10px; }
        .deck-container { display: flex; }
    </style>
</head>
<body>
    <h1>Card Game</h1>
    <div class="deck-container">
        <div id="stock" class="deck"></div>
        <div id="discard" class="deck"></div>
    </div>
    <div id="suits" class="deck-container"></div>
    <div id="piles" class="deck-container"></div>

    <button onclick="resetGame()">Reset</button>
    <button onclick="discardCards()">Discard</button>
    <button onclick="displayBoard()">Display Board</button>
    <button onclick="cheat()">Cheat</button>
    <button onclick="endGame()">End Game</button>

    <script src="scripts/klondike.js"></script>
</body>
</html>
